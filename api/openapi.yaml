openapi: 3.1.2
info:
  title: СВОЁ СтройКонтроль
  version: 0.1.0
  description: |
    Проект контракта первой итерации.
    Запросы и ответы с данными аккаунта, карточки или CSRF-токеном не кешируются.
    Для изменяющих операций сначала проверяется CSRF-токен, затем право доступа.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Accounts
    description: Регистрация, сессия и профиль аккаунта.
  - name: Projects
    description: Карточки домов и назначение подрядчика.
  - name: Stages
    description: План и фактический ход работ по дому.
  - name: Preparation
    description: Заявка, смета, договор и демонстрационная ипотека
  - name: Collaboration
    description: Ход работ, вопросы заказчику и повторное обращение к подрядчику
  - name: Organizations
    description: Профили, реквизиты и команда подрядчика
  - name: Journal
    description: Лента этапа и закрытые фото и документы
  - name: Acceptance
    description: Сдача, приёмка, демо-банк и завершение стройки
paths:
  /auth/csrf:
    get:
      tags:
        - Accounts
      operationId: getCsrfToken
      summary: Получить CSRF-токен текущей сессии или создать анонимную сессию
      security: []
      responses:
        "200":
          description: Токен для заголовка X-CSRF-TOKEN и cookie сессии при её создании
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
  /auth/register:
    post:
      tags:
        - Accounts
      operationId: register
      summary: Зарегистрировать аккаунт
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: owner@example.test
              password: example-password-123
              role: CUSTOMER
      responses:
        "201":
          description: Аккаунт создан. Для входа требуется отдельный запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/CsrfError"
        "409":
          description: EMAIL_ALREADY_EXISTS — нормализованный email занят.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /auth/login:
    post:
      tags:
        - Accounts
      operationId: login
      summary: Войти в аккаунт
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Профиль и cookie с новым ID сессии. Для следующих записей получить новый CSRF-токен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: INVALID_CREDENTIALS — email или пароль не совпадают.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/CsrfError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /auth/me:
    get:
      tags:
        - Accounts
      operationId: getCurrentAccount
      summary: Получить профиль текущего аккаунта
      responses:
        "200":
          description: Текущий аккаунт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/AuthRequired"
  /auth/logout:
    post:
      tags:
        - Accounts
      operationId: logout
      summary: Завершить текущую сессию
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Сессия завершена. Для следующего входа получить новый CSRF-токен.
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/CsrfError"
  /projects:
    get:
      tags:
        - Projects
      operationId: listProjects
      summary: Получить доступные карточки
      responses:
        "200":
          description: Список по убыванию времени создания и ID. При отсутствии карточек возвращается пустой
            массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags:
        - Projects
      operationId: createProject
      summary: Создать карточку дома
      description: Доступно заказчику.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: Дом в Берёзовке
              address: с. Берёзовка, ул. Центральная, 14
      responses:
        "201":
          description: Карточка создана
          headers:
            Location:
              required: true
              description: Путь к новой карточке
              schema:
                type: string
                format: uri-reference
                example: /api/v1/projects/3ba4a366-cf94-45c2-9bd9-f5e1b2bd5df2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Projects
      operationId: getProject
      summary: Открыть карточку дома
      description: Доступно владельцу и назначенному подрядчику.
      responses:
        "200":
          description: Карточка дома
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
  /projects/{projectId}/contractor:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags:
        - Projects
      operationId: assignContractor
      summary: Назначить подрядчика
      description: Доступно владельцу. Повтор для того же подрядчика возвращает текущее состояние.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignContractorRequest"
            example:
              email: builder@example.test
      responses:
        "200":
          description: Карточка с назначенным подрядчиком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: CONTRACTOR_ALREADY_ASSIGNED — уже назначен другой подрядчик.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: CONTRACTOR_NOT_FOUND — подходящий аккаунт подрядчика не найден.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /projects/{projectId}/stages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Stages
      operationId: listStages
      summary: Получить этапы в порядке плана
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401": &a1
          $ref: "#/components/responses/AuthRequired"
        "403": &a2
          $ref: "#/components/responses/WriteForbidden"
        "404": &a3
          $ref: "#/components/responses/StageNotFound"
    post:
      tags:
        - Stages
      operationId: createStage
      summary: Добавить этап в конец плана
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStageRequest"
      responses:
        "201":
          description: Этап создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
          headers:
            Location:
              required: true
              description: Путь к созданному этапу
              schema:
                type: string
                format: uri-reference
        "400":
          description: VALIDATION_ERROR — неверные поля. INVALID_STAGE_DATES — недопустимые плановые даты.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *a1
        "403": *a2
        "404": *a3
        "409":
          description: APPROVED_PLAN_LOCKED — план формируется из согласованного предложения
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      description: Прямое изменение плана доступно только проектам LEGACY. Для новых проектов план
        составляет подрядчик внутри предложения.
  /projects/{projectId}/stages/order:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags:
        - Stages
      operationId: reorderStages
      summary: Изменить полный порядок этапов
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderStagesRequest"
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/StageNotFound"
        "409":
          description: APPROVED_PLAN_LOCKED — план формируется из согласованного предложения
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      description: Прямое изменение плана доступно только проектам LEGACY. Для новых проектов план
        составляет подрядчик внутри предложения.
  /projects/{projectId}/stages/{stageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StageId"
    get:
      tags:
        - Stages
      operationId: getStage
      summary: Открыть этап
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401": &a4
          $ref: "#/components/responses/AuthRequired"
        "403": &a5
          $ref: "#/components/responses/WriteForbidden"
        "404": &a6
          $ref: "#/components/responses/StageNotFound"
    put:
      tags:
        - Stages
      operationId: updateStagePlan
      summary: Изменить плановые поля этапа
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStageRequest"
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          description: VALIDATION_ERROR — неверные поля. INVALID_STAGE_DATES — недопустимые плановые даты.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *a4
        "403": *a5
        "404": *a6
        "409":
          description: APPROVED_PLAN_LOCKED — план формируется из согласованного предложения
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      description: Прямое изменение плана доступно только проектам LEGACY. Для новых проектов план
        составляет подрядчик внутри предложения.
  /projects/{projectId}/stages/{stageId}/start:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StageId"
    post:
      tags:
        - Stages
      operationId: startStage
      summary: Начать работы по этапу
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageCommand"
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/StageNotFound"
        "409":
          $ref: "#/components/responses/StageConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      description: Для новых проектов требуется согласованное предложение и договор подряда; иначе 409
        CONTRACT_REQUIRED.
  /projects/{projectId}/stages/{stageId}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StageId"
    post:
      tags:
        - Stages
      operationId: completeStage
      summary: Завершить работы по этапу
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageCommand"
      responses:
        "200":
          description: Текущее состояние этапов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/StageNotFound"
        "409":
          $ref: "#/components/responses/StageConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /projects/{projectId}/request:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Preparation
      operationId: preparation1
      summary: Получить заявку
      description: Проверяет доступ к проекту и состояние документа; черновик подрядчика скрыт от
        заказчика. Банковские сведения доступны только владельцу.
      responses:
        "200":
          description: Сохранённое состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructionRequest"
        "400":
          description: Ошибка полей
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Требуется вход
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Недостаточные права или CSRF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Объект отсутствует или недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Устаревшая версия или недопустимое состояние
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Демонстрационный банк недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags:
        - Preparation
      operationId: preparation2
      summary: Сохранить черновик заявки
      description: Проверяет доступ к проекту и состояние документа; черновик подрядчика скрыт от
        заказчика. Банковские сведения доступны только владельцу.
      responses:
        "200":
          description: Сохранённое состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructionRequest"
        "400":
          description: Ошибка полей
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Требуется вход
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Недостаточные права или CSRF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Объект отсутствует или недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Устаревшая версия или недопустимое состояние
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Демонстрационный банк недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPatch"
  /projects/{projectId}/request/submit:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - Preparation
      operationId: preparation3
      summary: Отправить заявку
      description: Проверяет доступ к проекту и состояние документа; черновик подрядчика скрыт от
        заказчика. Банковские сведения доступны только владельцу.
      responses:
        "200":
          description: Сохранённое состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructionRequest"
        "400":
          description: Ошибка полей
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Требуется вход
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Недостаточные права или CSRF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Объект отсутствует или недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Устаревшая версия или недопустимое состояние
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Демонстрационный банк недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCommand"
  /projects/{projectId}/proposals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Preparation
      operationId: preparation4
      summary: "История: предложение"
      description: Проверяет доступ к проекту и состояние документа; черновик подрядчика скрыт от
        заказчика. Банковские сведения доступны только владельцу.
      responses:
        "200":
          description: Сохранённое состояние
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConstructionProposal"
        "400":
          description: Ошибка полей
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Требуется вход
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Недостаточные права или CSRF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Объект отсутствует или недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Устаревшая версия или недопустимое состояние
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Демонстрационный банк недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Preparation
      operationId: preparation5
      summary: Подготовить предложение
      description: Проверяет доступ к проекту и состояние документа; черновик подрядчика скрыт от
        заказчика. Банковские сведения доступны только владельцу.
      responses:
        "200":
          description: Сохранённое состояние
          content:
