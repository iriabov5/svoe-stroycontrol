components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: VALIDATION_ERROR — неверный JSON, поле или параметр.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthRequired:
      description: AUTH_REQUIRED — требуется действующая сессия пользователя.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CsrfError:
      description: INVALID_CSRF_TOKEN — токен отсутствует или неверен.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WriteForbidden:
      description: FORBIDDEN — роль или участие не дают права на запись. INVALID_CSRF_TOKEN — токен
        отсутствует или неверен.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProjectNotFound:
      description: PROJECT_NOT_FOUND — карточка отсутствует или скрыта от пользователя.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE — для тела запроса требуется application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StageNotFound:
      description: PROJECT_NOT_FOUND — карточка недоступна. STAGE_NOT_FOUND — этап отсутствует или
        относится к другой карточке.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StageConflict:
      description: STALE_STAGE_VERSION — данные уже изменены, загрузите актуальные.
        INVALID_STAGE_TRANSITION — переход невозможен в текущем состоянии.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    InputEmail:
      type: string
      minLength: 3
      maxLength: 320
      description: После удаления пробелов по краям и приведения к нижнему регистру должен быть email
        длиной не более 254 символов.
      pattern: ^\s*[^\s@]+@[^\s@.]+(?:\.[^\s@.]+)+\s*$
    Password:
      type: string
      writeOnly: true
      minLength: 12
      maxLength: 128
      description: Проверяется и передаётся без обрезки пробелов или нормализации.
    Role:
      type: string
      enum:
        - CUSTOMER
        - CONTRACTOR
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - role
      properties:
        email:
          $ref: "#/components/schemas/InputEmail"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/InputEmail"
        password:
          $ref: "#/components/schemas/Password"
    CsrfToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    Account:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
        profileVersion: *a25
        membership:
          anyOf:
            - $ref: "#/components/schemas/MembershipSummary"
            - type: "null"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          description: Название. Пробелы по краям удаляются перед сохранением.
        address:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
          description: Адрес свободным текстом. Пробелы по краям удаляются перед сохранением.
    AssignContractorRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/InputEmail"
    Project:
      type: object
      required:
        - id
        - name
        - address
        - customerId
        - contractorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 300
        customerId:
          type: string
          format: uuid
        contractorId:
          type:
            - string
            - "null"
          format: uuid
          description: UUID назначенного подрядчика или null до назначения.
        createdAt:
          type: string
          format: date-time
          description: Время создания карточки в UTC.
        processMode:
          type: string
          enum:
            - LEGACY
            - PROPOSAL_REQUIRED
        requestSubmitted:
          type: boolean
        approvedProposalId:
          type:
            - string
            - "null"
          format: uuid
        approvedContractId:
          type:
            - string
            - "null"
          format: uuid
        preparationClosed:
          type: boolean
        contractorOrganizationId:
          anyOf:
            - *a9
            - type: "null"
        contractorOrganization:
          anyOf:
            - $ref: "#/components/schemas/Organization"
            - type: "null"
        ownerPresentation:
          anyOf:
            - $ref: "#/components/schemas/ActorSnapshot"
            - type: "null"
        primaryContact:
          anyOf:
            - $ref: "#/components/schemas/ActorSnapshot"
            - type: "null"
        permissions:
          $ref: "#/components/schemas/ProjectPermissions"
        completedAt: &a60
          type:
            - string
            - "null"
          format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - EMAIL_ALREADY_EXISTS
            - INVALID_CREDENTIALS
            - AUTH_REQUIRED
            - INVALID_CSRF_TOKEN
            - FORBIDDEN
            - PROJECT_NOT_FOUND
            - CONTRACTOR_NOT_FOUND
            - CONTRACTOR_ALREADY_ASSIGNED
            - UNSUPPORTED_MEDIA_TYPE
            - INVALID_STAGE_DATES
            - STAGE_NOT_FOUND
            - STALE_STAGE_VERSION
            - INVALID_STAGE_TRANSITION
            - PROPOSAL_NOT_FOUND
            - CONTRACT_NOT_FOUND
            - STALE_REQUEST_VERSION
            - STALE_PROPOSAL_VERSION
            - STALE_CONTRACT_VERSION
            - INVALID_PROPOSAL_STATE
            - INVALID_CONTRACT_STATE
            - REQUEST_LOCKED
            - CONTRACTOR_REQUIRED
            - APPROVED_PLAN_LOCKED
            - CONTRACT_REQUIRED
            - BANK_DEMO_UNAVAILABLE
            - IDEMPOTENCY_CONFLICT
            - JOURNAL_ENTRY_NOT_FOUND
            - JOURNAL_STAGE_STATE
            - STALE_JOURNAL_VERSION
            - JOURNAL_ALREADY_RESOLVED
            - PREPARATION_CLOSED
            - REQUEST_ALREADY_REISSUED
            - INVALID_REISSUE_CONTRACTOR
            - PROFILE_REQUIRED
            - STALE_PROFILE_VERSION
            - ORGANIZATION_NOT_FOUND
            - INVITATION_NOT_FOUND
            - STALE_ORGANIZATION_VERSION
            - STALE_TEAM_VERSION
            - MEMBERSHIP_CONFLICT
