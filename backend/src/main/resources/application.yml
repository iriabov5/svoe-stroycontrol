spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: svoe-stroycontrol
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stroycontrol}
    username: ${SPRING_DATASOURCE_USERNAME:stroycontrol}
    password: ${SPRING_DATASOURCE_PASSWORD:stroycontrol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:19001}
  access-key: ${STORAGE_ACCESS_KEY:local-stroycontrol}
  secret-key: ${STORAGE_SECRET_KEY:unused-test-secret}
  bucket: ${STORAGE_BUCKET:stroycontrol-private}

bank:
  plot:
    scenario: ${BANK_PLOT_SCENARIO:NORMAL}
  stage:
    scenario: ${BANK_STAGE_SCENARIO:ACCEPTED}

logging:
  level:
    ru.rshb.stroycontrol: INFO
  pattern:
    level: "%5p [запрос=%X{requestId:-—}]"
