services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: stroycontrol
      POSTGRES_USER: stroycontrol
      POSTGRES_PASSWORD: stroycontrol
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroycontrol -d stroycontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-local-stroycontrol}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      S3_BUCKET: ${STORAGE_BUCKET:-stroycontrol-private}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/); test \"$$code\" = 401 || test \"$$code\" = 403"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stroycontrol
      SPRING_DATASOURCE_USERNAME: stroycontrol
      SPRING_DATASOURCE_PASSWORD: stroycontrol
      STORAGE_ENDPOINT: http://s3:8333
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-local-stroycontrol}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-stroycontrol-private}
      BANK_PLOT_SCENARIO: ${BANK_PLOT_SCENARIO:-NORMAL}
      BANK_STAGE_SCENARIO: ${BANK_STAGE_SCENARIO:-NEEDS_INFORMATION}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      s3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  # Старый том сохраняется для разового переноса и возврата, новое приложение его не использует.
  attachments-data:
