services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: stroycontrol
      POSTGRES_USER: stroycontrol
      POSTGRES_PASSWORD: stroycontrol
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroycontrol -d stroycontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: svoe-stroycontrol-minio:local
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-local-stroycontrol}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    volumes:
      - attachments-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stroycontrol
      SPRING_DATASOURCE_USERNAME: stroycontrol
      SPRING_DATASOURCE_PASSWORD: stroycontrol
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-local-stroycontrol}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: stroycontrol-private
      BANK_STAGE_SCENARIO: ${BANK_STAGE_SCENARIO:-NEEDS_INFORMATION}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  attachments-data:
